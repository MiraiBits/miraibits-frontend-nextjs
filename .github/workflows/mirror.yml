name: Mirror Repository

on:
  push:
    branches:
      - '**' # This now triggers on a push to any branch

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          
      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MIRROR_REPO_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "github.com" >> ~/.ssh/known_hosts

      - name: Push to mirror
        run: git push --mirror git@github.com:miraibitselectronics/miraibits-frontend-nextjs.git

      # - name: Push to mirror
      #   run: git push --mirror https://miraibitselectronics:${{ secrets.MIRROR_REPO_PAT }}@github.com/miraibitselectronics/miraibits-frontend-nextjs.git
